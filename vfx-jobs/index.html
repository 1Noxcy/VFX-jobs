<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Veille offres jeu vidéo</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f27;--mu:#667085;--bd:#e3e6ec;--ac:#2563eb}
@media (prefers-color-scheme:dark){:root{--bg:#12151b;--card:#1b2029;--tx:#e8ebf1;--mu:#98a2b3;--bd:#2a3140;--ac:#6ea0ff}}
*{box-sizing:border-box}body{margin:0;font:15px/1.45 system-ui,sans-serif;background:var(--bg);color:var(--tx);padding:16px;max-width:900px;margin:auto}
h1{font-size:20px;margin:0 0 4px}.mu{color:var(--mu);font-size:13px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
input,select,button{font:inherit;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx)}
input{flex:1;min-width:160px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px 14px;margin:8px 0}
.card a{color:var(--ac);text-decoration:none;font-weight:600}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;border:1px solid var(--bd);margin-right:6px}
.new{background:#16a34a;color:#fff;border-color:#16a34a}.p2{background:var(--ac);color:#fff;border-color:var(--ac)}
details{margin-top:18px}summary{cursor:pointer;font-weight:600}
td{padding:4px 8px 4px 0;vertical-align:top;font-size:13px}
</style></head><body>
<h1>Veille offres jeu vidéo</h1><div class="mu" id="upd">Chargement…</div>
<div class="bar">
<input id="q" placeholder="Rechercher (vfx, niagara, qa, Montréal…)">
<select id="pr"><option value="1">Pertinentes</option><option value="2">VFX / Unreal seulement</option><option value="0">Toutes les offres</option></select>
<select id="co"><option value="">France + Canada</option><option>FR</option><option>CA</option></select>
</div>
<div id="list"></div>
<details><summary>Studios surveillés <span class="mu" id="cnt"></span></summary><table id="st"></table></details>
<script>
let D=null;const $=id=>document.getElementById(id);
const fmt=d=>d?new Date(d).toLocaleString("fr-FR",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"}):"jamais";
function render(){
  if(!D)return;const q=$("q").value.toLowerCase(),pr=+$("pr").value,co=$("co").value,now=Date.now(),rows=[];
  for(const[n,s]of Object.entries(D.studios)){if(co&&s.country!==co)continue;
    for(const j of Object.values(s.jobs)){if(j.closed_at||(j.match||0)<pr)continue;
      if(q&&!(n+" "+j.title+" "+(j.location||"")+" "+s.city).toLowerCase().includes(q))continue;rows.push([n,s,j]);}}
  rows.sort((a,b)=>b[2].first_seen.localeCompare(a[2].first_seen));
  $("list").innerHTML=rows.map(([n,s,j])=>{const isNew=now-new Date(j.first_seen)<48*36e5;
    return `<div class="card"><a href="${j.url}" target="_blank" rel="noopener">${esc(j.title)}</a><br>
    <span class="mu">${esc(n)} · ${esc(j.location||s.city||"")} · détectée ${fmt(j.first_seen)}</span><br>
    ${isNew?'<span class="tag new">nouvelle</span>':""}${j.match==2?'<span class="tag p2">VFX / Unreal</span>':""}</div>`}).join("")
    ||'<div class="card mu">Aucune offre pour ces filtres. Vérifie la liste des studios ci-dessous.</div>';
}
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
fetch("data/jobs.json?"+Date.now()).then(r=>r.json()).then(d=>{D=d;
  $("upd").textContent=d.updated?"Dernière vérification : "+fmt(d.updated):"Pas encore de données (lance le workflow une première fois).";
  const e=Object.entries(d.studios);$("cnt").textContent="("+e.length+")";
  $("st").innerHTML=e.map(([n,s])=>`<tr><td>${s.error?"⚠️":"✅"}</td><td>${s.url?`<a href="${s.url}" target="_blank" rel="noopener">${esc(n)}</a>`:esc(n)}</td>
  <td class="mu">${s.error?esc(s.error):Object.values(s.jobs).filter(j=>!j.closed_at).length+" offres ouvertes · vérifié "+fmt(s.last_checked)}${s.email?" · "+esc(s.email):""}</td></tr>`).join("");
  render()}).catch(()=>$("upd").textContent="Impossible de lire data/jobs.json");
["q","pr","co"].forEach(i=>$(i).addEventListener("input",render));
</script></body></html>
