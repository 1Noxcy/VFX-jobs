<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Radar des offres jeu vidéo</title>
<meta name="description" content="Offres d'emploi jeu vidéo en France et au Canada, triées selon mon profil de VFX artist temps réel.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F2FB;--panel:#FFFFFF;--line:#DCD7EE;--ink:#1D1838;--mute:#5E5785;
  --ember:#C24E12;--ember-soft:#FBE5D8;--spark:#0B806F;--spark-soft:#D5F3EE;--focus:#6A4CE0;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#161330;--panel:#1F1B40;--line:#332D63;--ink:#EEEBFA;--mute:#A49DCB;
  --ember:#FF9147;--ember-soft:#3A2440;--spark:#45E0C8;--spark-soft:#173A44;--focus:#B8A6FF;
}}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Atkinson Hyperlegible",system-ui,sans-serif}
a{color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}

/* En-tête : un émetteur de particules, clin d'œil à Niagara */
header{position:relative;overflow:hidden;border-bottom:1px solid var(--line)}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.head{position:relative;max-width:1080px;margin:0 auto;padding:56px 20px 36px}
h1{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:clamp(34px,6vw,60px);line-height:1.02;letter-spacing:-.02em;margin:0 0 14px;max-width:14ch}
.lede{margin:0;color:var(--mute);max-width:62ch}
.lede strong{color:var(--ink)}

main{max-width:1080px;margin:0 auto;padding:24px 20px 64px}
.controls{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:8px}
.tabs{display:flex;gap:4px;padding:4px;background:var(--panel);border:1px solid var(--line);border-radius:999px;flex-wrap:wrap}
.tabs button{font:inherit;font-weight:700;font-size:14px;border:0;background:none;color:var(--mute);padding:8px 16px;border-radius:999px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.search{flex:1;min-width:200px;font:inherit;padding:10px 16px;border:1px solid var(--line);border-radius:999px;background:var(--panel);color:var(--ink)}
.toggle{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--mute);margin:6px 0 18px;cursor:pointer}
.toggle input{accent-color:var(--focus);width:16px;height:16px}

.list{border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:minmax(0,1fr) 190px 170px 110px;gap:16px;align-items:start;padding:16px 14px 16px 18px;border-bottom:1px solid var(--line);position:relative}
.row.core::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:4px;border-radius:4px;background:var(--ember)}
.row.headrow{padding-top:10px;padding-bottom:10px;font-size:13px;color:var(--mute);font-weight:700}
.title{font-weight:700;font-size:17px;line-height:1.35;text-decoration:none}
.title:hover{text-decoration:underline;text-underline-offset:3px}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.b{font-size:12.5px;font-weight:700;padding:2px 9px;border-radius:999px;line-height:1.6}
.b.core{background:var(--ember-soft);color:var(--ember)}
.b.new{background:var(--spark-soft);color:var(--spark)}
.b.info{border:1px solid var(--line);color:var(--mute)}
.studio{font-weight:700}
.sub{display:block;font-size:13px;color:var(--mute);font-weight:400}
.place{font-weight:700}
.when{color:var(--mute);font-size:14px}
.empty{padding:40px 18px;color:var(--mute);border-bottom:1px solid var(--line)}
.empty strong{color:var(--ink)}

section.studios{margin-top:56px}
h2{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:26px;letter-spacing:-.01em;margin:0 0 6px}
.legend{color:var(--mute);font-size:14px;margin:0 0 16px;max-width:70ch}
details{border-top:1px solid var(--line)}
summary{cursor:pointer;padding:14px 0;font-weight:700;list-style:none;display:flex;justify-content:space-between;gap:12px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";color:var(--mute);font-weight:400}
details[open] summary::after{content:"−"}
.srow{display:grid;grid-template-columns:28px 230px minmax(0,1fr);gap:12px;padding:10px 0;border-top:1px dashed var(--line);font-size:14.5px}
.srow .st{color:var(--mute)}
.srow .note{display:block;font-size:13px;color:var(--mute);margin-top:2px}
footer{color:var(--mute);font-size:13px;margin-top:40px}

@media (max-width:760px){
  .head{padding:40px 16px 28px}
  main{padding:20px 16px 48px}
  .row{grid-template-columns:1fr;gap:4px;padding-left:16px}
  .row.headrow{display:none}
  .tabs{display:grid;grid-template-columns:1fr 1fr;border-radius:20px;width:100%}
  .tabs button{border-radius:14px}
  .row .when{font-size:13px}
  .srow{grid-template-columns:24px minmax(0,1fr)}
  .srow .st{grid-column:2}
}
</style>
</head>
<body>
<header>
  <canvas id="fx" aria-hidden="true"></canvas>
  <div class="head">
    <h1>Radar des offres jeu vidéo</h1>
    <p class="lede" id="lede">Chargement des offres…</p>
  </div>
</header>

<main>
  <div class="controls">
    <div class="tabs" role="group" aria-label="Filtrer les offres">
      <button data-tab="all" aria-pressed="true">Toutes les offres</button>
      <button data-tab="vfx" aria-pressed="false">VFX et tech art</button>
      <button data-tab="FR" aria-pressed="false">France</button>
      <button data-tab="CA" aria-pressed="false">Canada</button>
    </div>
    <input class="search" id="q" type="search" placeholder="Chercher un poste, un studio, une ville…" aria-label="Chercher">
  </div>
  <label class="toggle"><input type="checkbox" id="all"> Afficher aussi les offres hors de mon profil</label>

  <div class="list" id="list" aria-live="polite"></div>

  <section class="studios">
    <h2>Studios suivis</h2>
    <p class="legend">✅ offres lues de façon fiable. 🟡 page du studio lue de façon approximative. ⚠️ rien détecté ou problème de lecture, à vérifier à la main. 📩 pas de page offres : candidature spontanée. ❔ aucun site trouvé.</p>
    <div id="studios"></div>
  </section>
  <footer id="foot"></footer>
</main>

<script>
const $ = id => document.getElementById(id);
const esc = t => String(t ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let D = null, tab = "all";

function ago(d){
  if(!d) return "jamais";
  const m = Math.round((Date.now() - new Date(d)) / 60000);
  if(m < 60) return m <= 1 ? "à l'instant" : `il y a ${m} min`;
  const h = Math.round(m / 60);
  if(h < 24) return `il y a ${h} h`;
  const j = Math.round(h / 24);
  return j === 1 ? "hier" : `il y a ${j} jours`;
}
const CITY = {"montreal":"Montréal","montréal":"Montréal","quebec":"Québec","québec":"Québec","quebec city":"Québec","ville de québec":"Québec"};
function place(j, s){
  let l = (j.location || "").trim();
  if(/remote|distanciel|t[ée]l[ée]travail|à distance/i.test(l + " " + j.title)) return "À distance";
  if(!l) l = s.city || "";
  let c = l.split(/[,(]/)[0].trim();
  return CITY[c.toLowerCase()] || c || (s.country === "CA" ? "Canada" : "France");
}

function rows(){
  const out = [], q = $("q").value.trim().toLowerCase(), wide = $("all").checked;
  const base = Object.values(D.studios).flatMap(s => Object.values(s.jobs)).map(j => j.first_seen).sort()[0];
  for(const [n, s] of Object.entries(D.studios)){
    for(const j of Object.values(s.jobs)){
      if(j.closed_at) continue;
      const m = j.match || 0;
      if(!wide && m < 1) continue;
      if(tab === "vfx" && m < 2) continue;
      if((tab === "FR" || tab === "CA") && s.country !== tab) continue;
      const studio = j.company || n, where = place(j, s);
      if(q && !(studio + " " + j.title + " " + where + " " + n).toLowerCase().includes(q)) continue;
      out.push({j, s, n, studio, where, isNew: j.first_seen > (s.since || base) && Date.now() - new Date(j.first_seen) < 48*36e5});
    }
  }
  out.sort((a, b) => (b.isNew - a.isNew) || ((b.j.match||0) - (a.j.match||0)) || b.j.first_seen.localeCompare(a.j.first_seen));
  return out;
}

function render(){
  if(!D) return;
  const r = rows();
  const flag = c => c === "CA" ? "🇨🇦" : "🇫🇷";
  const html = r.map(({j, s, n, studio, where, isNew}) => {
    const b = [];
    if(isNew) b.push('<span class="b new">Nouvelle</span>');
    if(j.match === 2) b.push('<span class="b core">Cœur de métier</span>');
    if(/\bstage\b|stagiaire|\bintern(ship)?\b/i.test(j.title))
      b.push(`<span class="b info">${s.country === "CA" ? "Stage, possible avec ton PVT" : "Stage, pas accessible en France pour toi"}</span>`);
    if(j.published) b.push(`<span class="b info">Publiée le ${esc(j.published)}</span>`);
    return `<div class="row${j.match === 2 ? " core" : ""}">
      <div><a class="title" href="${esc(j.url)}" target="_blank" rel="noopener">${esc(j.title)}</a>
        ${b.length ? `<div class="badges">${b.join("")}</div>` : ""}</div>
      <div class="studio">${esc(studio)}${j.company ? '<span class="sub">via AFJV</span>' : ""}</div>
      <div class="place">${flag(s.country)} ${esc(where)}</div>
      <div class="when">${ago(j.first_seen)}</div>
    </div>`;
  }).join("");
  $("list").innerHTML = r.length
    ? `<div class="row headrow"><div>Poste</div><div>Studio</div><div>Lieu</div><div>Repérée</div></div>` + html
    : `<div class="empty"><strong>Aucune offre ne correspond.</strong> Essaie un autre onglet, vide la recherche, ou coche « Afficher aussi les offres hors de mon profil ».</div>`;
}

function lede(){
  const all = Object.values(D.studios).flatMap(s => Object.values(s.jobs).filter(j => !j.closed_at));
  const fit = all.filter(j => (j.match||0) >= 1).length, core = all.filter(j => j.match === 2).length;
  const fr = Object.values(D.studios).filter(s => s.country === "FR").length, ca = Object.values(D.studios).length - fr;
  $("lede").innerHTML = `<strong>${fit} offres</strong> correspondent à mon profil de VFX artist temps réel, dont <strong>${core}</strong> en plein dans mon cœur de métier. ` +
    `${fr} sources suivies en France et ${ca} au Canada, vérifiées toutes les 5 heures. Dernière vérification ${ago(D.updated)}.`;
}

function studios(){
  const icon = s => s.mode === "contact" ? ((s.email || s.contact || s.social) ? "📩" : "❔") : s.error || s.warn ? "⚠️" : s.mode === "page" ? "🟡" : "✅";
  const group = (c, label) => {
    const list = Object.entries(D.studios).filter(([, s]) => s.country === c);
    const items = list.map(([n, s]) => {
      const link = s.url || s.contact || s.social;
      const open = Object.values(s.jobs).filter(j => !j.closed_at).length;
      const st = s.error ? esc(s.error) : s.warn ? esc(s.warn) : `${open} offre${open > 1 ? "s" : ""} ouverte${open > 1 ? "s" : ""}${s.mode === "page" ? " (lecture approximative)" : ""}, vérifié ${ago(s.last_checked)}${s.email && s.mode !== "contact" ? `, ${esc(s.email)}` : ""}`;
      return `<div class="srow"><div>${icon(s)}</div>
        <div>${link ? `<a href="${esc(link)}" target="_blank" rel="noopener">${esc(n)}</a>` : esc(n)}<span class="sub">${esc(s.city || "")}</span></div>
        <div class="st">${st}${s.note ? `<span class="note">${esc(s.note)}</span>` : ""}</div></div>`;
    }).join("");
    return `<details><summary>${label} <span class="sub">${list.length} sources</span></summary>${items}</details>`;
  };
  $("studios").innerHTML = group("FR", "🇫🇷 France") + group("CA", "🇨🇦 Canada");
}

document.querySelectorAll(".tabs button").forEach(b => b.addEventListener("click", () => {
  tab = b.dataset.tab;
  document.querySelectorAll(".tabs button").forEach(x => x.setAttribute("aria-pressed", x === b));
  render();
}));
$("q").addEventListener("input", render);
$("all").addEventListener("change", render);

fetch("data/jobs.json?" + Date.now()).then(r => r.json()).then(d => {
  D = d; lede(); render(); studios();
  $("foot").textContent = "Sources : pages carrières officielles des studios et AFJV. Une offre peut rester en ligne alors que le poste est déjà pourvu.";
}).catch(() => { $("lede").textContent = "Impossible de lire les offres pour le moment. Réessaie dans quelques minutes."; });

/* Émetteur de braises : quelques particules qui montent, comme un petit système Niagara. */
(() => {
  const cv = $("fx"), ctx = cv.getContext("2d");
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let W, H, P = [];
  const css = () => getComputedStyle(document.documentElement);
  function size(){ const r = cv.getBoundingClientRect(), k = devicePixelRatio || 1; W = r.width; H = r.height; cv.width = W*k; cv.height = H*k; ctx.setTransform(k,0,0,k,0,0); }
  function spawn(y){ const n = W < 760; return {x: W*((n ? 0.62 : 0.45) + Math.random()*(n ? 0.38 : 0.55)), y: y ?? H + 10, v: 0.25 + Math.random()*0.7, r: 0.8 + Math.random()*2.4, w: Math.random()*6.28, life: 0.4 + Math.random()*0.6, hue: Math.random() < .8 ? "--ember" : "--spark"}; }
  function frame(){
    ctx.clearRect(0,0,W,H);
    const st = css();
    for(const p of P){
      if(!still){ p.y -= p.v; p.w += 0.02; p.x += Math.sin(p.w)*0.3; }
      const a = Math.max(0, Math.min(1, p.y / H)) * p.life * 0.75;
      ctx.globalAlpha = a; ctx.fillStyle = st.getPropertyValue(p.hue);
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.28); ctx.fill();
      if(p.y < -10) Object.assign(p, spawn());
    }
    ctx.globalAlpha = 1;
    if(!still) requestAnimationFrame(frame);
  }
  size(); P = Array.from({length: 70}, () => spawn(Math.random()*H));
  addEventListener("resize", () => { size(); if(still) frame(); });
  frame();
})();
</script>
</body>
</html>
